<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="50%" stop-color="#F7F3EB"/>
      <stop offset="100%" stop-color="#EFE9DD"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A880"/>
      <stop offset="50%" stop-color="#E0C9A6"/>
      <stop offset="100%" stop-color="#B8976C"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="24" y="24" width="552" height="552" rx="16" fill="none" stroke="#E5DDD0" stroke-width="1.5" stroke-dasharray="6 4"/>
  
  <!-- Decorative Brand Icon (Luxury Gift / Atelier Motif) -->
  <g transform="translate(300, 260)">
    <!-- Center Emblem Circle -->
    <circle cx="0" cy="0" r="54" fill="#FFFFFF" stroke="#E5DDD0" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="url(#goldGrad)" stroke-width="1"/>
    
    <!-- Gift Ribbon & Sparkle Silhouette -->
    <path d="M-18,-10 C-26,-22 -14,-32 0,-18 C14,-32 26,-22 18,-10 Z" fill="url(#goldGrad)" opacity="0.9"/>
    <rect x="-16" y="-6" width="32" height="24" rx="2" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <line x1="0" y1="-6" x2="0" y2="18" stroke="url(#goldGrad)" stroke-width="2"/>
    <line x1="-16" y1="6" x2="16" y2="6" stroke="url(#goldGrad)" stroke-width="2"/>
    
    <!-- Sparkles -->
    <path d="M-30,-22 L-28,-16 L-22,-14 L-28,-12 L-30,-6 L-32,-12 L-38,-14 L-32,-16 Z" fill="url(#goldGrad)" opacity="0.75"/>
    <path d="M30,-22 L32,-16 L38,-14 L32,-12 L30,-6 L28,-12 L22,-14 L28,-16 Z" fill="url(#goldGrad)" opacity="0.75"/>
  </g>
  
  <!-- Text Brand Label -->
  <text x="300" y="360" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="16" font-weight="600" letter-spacing="4" fill="#2B1810">
    GIFTAGRAM
  </text>
  <text x="300" y="386" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="400" letter-spacing="2" fill="#8C7A6B">
    ARTISANAL CREATION
  </text>
</svg>
