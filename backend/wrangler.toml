name = "giftagram-backend"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "giftagram_prod"
database_id = "YOUR_D1_DATABASE_ID_HERE"

# Cloudflare R2 Bucket Binding (for Product & Reference Images)
[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "giftagram-images"

[vars]
ENVIRONMENT = "production"
FRONTEND_URL = "https://giftagram.pages.dev"
RAZORPAY_KEY_ID = "YOUR_RAZORPAY_KEY_ID"
